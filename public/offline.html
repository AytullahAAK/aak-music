<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2f7" />
    <title>AAK Music — Offline</title>
    <style>
      :root{color-scheme:light dark;font-family:system-ui,sans-serif;background:#f4f2f7;color:#17151d}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}.panel{width:min(100%,520px);padding:32px;border:1px solid #8a849522;border-radius:24px;background:#fff9;box-shadow:0 18px 60px #17151d14}h1{margin:0 0 12px;font-size:clamp(1.7rem,5vw,2.5rem)}p{line-height:1.7;color:#514c59}a{display:inline-flex;min-height:44px;align-items:center;color:#5138bc;font-weight:700}@media(prefers-color-scheme:dark){:root{background:#111016;color:#f4f2f7}.panel{background:#211e2a;border-color:#fff2}p{color:#c7c2d1}a{color:#94e4f4}}
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>You're offline</h1>
      <p>The AAK Music app shell is installed, but music search and streaming need an internet connection. Reconnect and try again to continue listening.</p>
      <a href="/">Try AAK Music again</a>
    </main>
  </body>
</html>
